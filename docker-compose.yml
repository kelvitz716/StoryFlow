services:
  storyflow_app:
    image: storyflow:latest
    container_name: storyflow_app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - proxy_net
    volumes:
      # Map data folders to local directory
      - ./downloads:/app/downloads:z
      - ./cookies:/app/cookies:z
      - ./sessions:/app/sessions:z
      - ./data:/app/data:z
      - ./logs:/app/logs:z
    env_file:
      - .env
    mem_limit: ${STORYFLOW_MEM_LIMIT:-2g}
    cpus: ${STORYFLOW_CPUS:-2.0}
    # Container hardening (G3 / K2)
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.cache:size=256m,uid=1000,gid=1000,mode=0700
      - /app/.local:size=256m,uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

networks:
  proxy_net:
    external: true
