services:
  storyflow_app:
    image: storyflow:latest
    container_name: storyflow_app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - proxy_net
    volumes:
      # Map data folders to local directory
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    # G3 container hardening
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

networks:
  proxy_net:
    external: true
